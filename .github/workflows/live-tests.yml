# TECH-001: alla tester mot den riktiga sajten efter varje publicering.
# Vercel meddelar GitHub med en status ("Vercel") på commiten när en deploy
# är klar. Bara lyckade deployer av main testas, för det är produktionen;
# förhandsversionerna testas av Preview tests (TECH-007). Övriga statusar ger en
# överhoppad körning. Kan också startas för hand under Actions → Live tests.
name: Live tests

on:
  status:
  workflow_dispatch:

jobs:
  live:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' &&
       github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Produktionens lösenord. Saknas det hoppas admin-testerna över.
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      # Testerna från samma commit som publicerades
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.sha || github.sha }}

      - uses: ./.github/actions/setup-tests
      - run: npm test

      - name: Spara testrapporten
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            playwright-report/
            test-results/
          retention-days: 14
