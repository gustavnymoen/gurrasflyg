# TECH-001: kontroller för varje pull request och varje push till main.
# TECH-013: säkerhetsjobbet bredvid: sårbara paket, osäker kod och läckta hemligheter.
# Bara pull_request för andra grenar, annars körs allt två gånger (TECH-007).
# Lint, typkontroll, bygge och alla tester mot ett lokalt produktionsbygge
# med egen testdatabas. Använder varken Turso eller några riktiga lösenord.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN får bara läsa (TECH-013)
permissions:
  contents: read

# En ny push på samma gren avbryter den förra körningen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TECH-011: Playwrights image, samma version som @playwright/test
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-tests

      # Påhittat lösenord och nyckel för testservern, bara för den här körningen
      - name: Engångslösenord för testerna
        run: |
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "ADMIN_SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:local

      - name: Spara testrapporten
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # TECH-013: sårbara paket (npm audit), osäkra mönster i vår kod (Semgrep) och
  # hemligheter i hela git-historiken (Gitleaks). Gratisverktyg; Semgrep och
  # Gitleaks körs från sina officiella images med fast version.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Hela historiken, så att Gitleaks ser varje commit
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bara paketen sajten använder i produktion, och bara allvarliga fynd
      - name: Sårbara paket
        run: npm audit --omit=dev --audit-level=high

      # Semgreps fria regler för JavaScript, TypeScript, React, Next.js och SQL.
      # Ett fel som inte är ett fel markeras i koden med nosemgrep och varför.
      - name: Osäker kod
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.182.0 \
            semgrep scan --error --metrics=off \
              --config p/javascript --config p/typescript --config p/react \
              --config p/nextjs --config p/sql-injection

      # Hela historiken varje gång: den är liten, och en hemlighet som kommit in
      # tidigare ska också hittas. Värdena skrivs aldrig ut (--redact).
      - name: Läckta hemligheter
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.30.1 -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --redact --verbose'
