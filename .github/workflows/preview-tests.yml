# TECH-007: tester mot pull requestens förhandsversion på Vercel, före merge.
# TECH-014: bara rökproven (npm run test:smoke); hela sviten körs en gång, i CI.
# Startar när Vercel meddelar att en förhandsversion är klar (deployment_status),
# med förhandsversionens adress i händelsen, och körs på samma commit.
# Förhandsversionen har en egen Turso-databas, och rökproven skriver ingenting.
name: Preview tests

on:
  deployment_status:

# GITHUB_TOKEN får bara läsa (TECH-013)
permissions:
  contents: read

# En nyare förhandsversion av samma gren avbryter den förra körningen
concurrency:
  group: preview-${{ github.event.deployment.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Bara lyckade förhandsversioner; produktionen testas av Live tests
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # TECH-011: Playwrights image, samma version som @playwright/test
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      # Samma commit som förhandsversionen byggdes från
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: ./.github/actions/setup-tests

      # Bypass-hemligheten tar testerna förbi Vercels inloggning för
      # förhandsversioner, och bara i det här steget (TECH-013)
      - run: npm run test:smoke
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Spara testrapporten
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-preview
          path: |
            playwright-report/
            test-results/
          retention-days: 14
