# TECH-007: gemensam förberedelse för arbetsflödena som kör Playwright
# (CI, Live tests, Preview tests). Kräver att repot redan är utcheckat.
# TECH-011: jobben körs i Playwrights image, där Node, Chromium och dess
# systembibliotek redan finns, så här installeras bara paketen.
name: Förbered testerna
description: Paketen, och en kontroll av att imagen har rätt Playwright-version.

runs:
  using: composite
  steps:
    # Imagens Node, men npm-cachen från setup-node
    - uses: actions/setup-node@v4
      with:
        cache: npm

    - run: npm ci
      shell: bash

    - run: node scripts/check-playwright-image.mjs
      shell: bash
