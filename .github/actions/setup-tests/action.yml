# TECH-007: gemensam förberedelse för arbetsflödena som kör Playwright
# (CI, Live tests, Preview tests). Kräver att repot redan är utcheckat.
# Chromium sparas inte i cache: nedladdningen tar några sekunder, och
# systembiblioteken måste installeras på varje ny maskin ändå.
name: Förbered testerna
description: Node, paketen och Chromium.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: npm

    - run: npm ci
      shell: bash

    # postinstall hoppar över webbläsaren när CI är satt, så den installeras här
    - run: npx playwright install --with-deps chromium
      shell: bash
